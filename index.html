<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2 күндүк акысыз сабак</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background: #f5f1e8;
    font-family: Georgia, "Times New Roman", serif;
    overflow: hidden;
}

/* ===== ЭКРАН С КОНВЕРТОМ ===== */

.start {
    position: fixed;
    inset: 0;
    z-index: 10;

    display: flex;
    justify-content: center;
    align-items: center;

    background: #f5f1e8;

    transition: opacity 1s ease;
}

.start.hide {
    opacity: 0;
    pointer-events: none;
}

.envelope-box {
    width: 330px;
    max-width: 82vw;

    cursor: pointer;
    text-align: center;

    animation: floating 3s ease-in-out infinite;
}

.envelope {
    position: relative;

    width: 100%;
    aspect-ratio: 1.5;

    background: #d8c5a5;

    border-radius: 5px;

    box-shadow:
        0 25px 60px rgba(70,55,35,.22);

    overflow: visible;
}

/* письмо внутри */

.paper {
    position: absolute;

    z-index: 2;

    left: 8%;
    bottom: 5%;

    width: 84%;
    height: 90%;

    background: #fffdf8;

    display: flex;
    justify-content: center;
    align-items: center;

    text-align: center;

    padding: 20px;

    transition:
        transform 1.2s ease;
}

.paper-text {
    color: #354438;
}

.paper-small {
    font-family: Arial, sans-serif;

    font-size: 11px;

    letter-spacing: 3px;

    margin-bottom: 12px;
}

.paper-title {
    font-size: 22px;
}

/* верхняя часть конверта */

.flap {
    position: absolute;

    z-index: 4;

    top: 0;
    left: 0;

    width: 0;
    height: 0;

    border-left: 165px solid transparent;
    border-right: 165px solid transparent;
    border-top: 125px solid #bda783;

    transform-origin: top center;

    transition:
        transform 1.2s ease;
}

/* нижняя складка */

.envelope::before {
    content: "";

    position: absolute;

    z-index: 3;

    left: 0;
    bottom: 0;

    width: 0;
    height: 0;

    border-left: 165px solid transparent;
    border-right: 165px solid transparent;
    border-bottom: 120px solid #cbb58f;
}

/* открытие */

.envelope-box.open .flap {
    transform: rotateX(180deg);
}

.envelope-box.open .paper {
    transform: translateY(-75%);
}

/* подсказка */

.hint {
    margin-top: 35px;

    font-family: Arial, sans-serif;

    font-size: 12px;

    letter-spacing: 3px;

    color: #817664;

    text-transform: uppercase;

    animation: pulse 2s infinite;
}


/* ===== ОСНОВНОЙ САЙТ ===== */

.main {
    min-height: 100vh;

    opacity: 0;

    transition:
        opacity 1.5s ease;

    overflow-y: auto;
}

.main.show {
    opacity: 1;
}

.hero {
    min-height: 100vh;

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;

    text-align: center;

    padding: 40px 25px;

    background: #fffdf8;
}

.small-title {
    font-family: Arial, sans-serif;

    font-size: 11px;

    letter-spacing: 4px;

    color: #8b806e;

    margin-bottom: 25px;

    text-transform: uppercase;
}

.hero h1 {
    font-size: 48px;

    font-weight: 400;

    line-height: 1.05;

    color: #354438;
}

.hero h1 span {
    font-style: italic;

    color: #7c8e72;
}

.hero p {
    max-width: 500px;

    margin-top: 25px;

    font-size: 18px;

    line-height: 1.7;

    color: #66645e;
}

.date {
    margin-top: 40px;

    font-family: Arial, sans-serif;

    font-size: 18px;

    letter-spacing: 2px;

    color: #354438;
}


/* ===== АНИМАЦИЯ ===== */

@keyframes floating {

    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-10px);
    }

}

@keyframes pulse {

    0%,100% {
        opacity: .4;
    }

    50% {
        opacity: 1;
    }

}


/* ===== ТЕЛЕФОН ===== */

@media(max-width:600px) {

    .envelope-box {
        width: 300px;
    }

    .flap {
        border-left-width: 150px;
        border-right-width: 150px;
        border-top-width: 112px;
    }

    .envelope::before {
        border-left-width: 150px;
        border-right-width: 150px;
        border-bottom-width: 110px;
    }

    .hero h1 {
        font-size: 40px;
    }

}
</style>
</head>


<body>


<!-- ===== КОНВЕРТ ===== -->

<div class="start" id="start">

    <div class="envelope-box" id="envelopeBox">

        <div class="envelope">

            <div class="paper">

                <div class="paper-text">

                    <div class="paper-small">
                        Сиздерди чакырабыз
                    </div>

                    <div class="paper-title">
                        2 күндүк акысыз сабак
                    </div>

                </div>

            </div>

            <div class="flap"></div>

        </div>

        <div class="hint">
            Конвертти ачыңыз
        </div>

    </div>

</div>



<!-- ===== ОСНОВНОЙ САЙТ ===== -->

<div class="main" id="main">

    <section class="hero">

        <div class="small-title">
            Акысыз онлайн сабак
        </div>

        <h1>

            2 күндүк<br>

            <span>акысыз сабак</span>

        </h1>

        <p>

            Сиздерди нейросети, AI жана
            анимация боюнча 2 күндүк
            акысыз онлайн сабакка чакырабыз.

        </p>

        <div class="date">

            8–9 СЕНТЯБРЬ · 11:00 · ОНЛАЙН

        </div>

    </section>

</div>



<script>

const envelopeBox =
    document.getElementById("envelopeBox");

const start =
    document.getElementById("start");

const main =
    document.getElementById("main");


envelopeBox.addEventListener("click", function() {

    /* открываем конверт */

    envelopeBox.classList.add("open");


    /* через 1.4 секунды показываем сайт */

    setTimeout(function() {

        start.classList.add("hide");

        document.body.style.overflow = "auto";

        main.classList.add("show");

    }, 1400);

});

</script>


</body>
</html>
